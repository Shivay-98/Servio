services:
  app:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    depends_on:
      - mongo
    restart: unless-stopped
    networks:
      - servio-net

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - servio-net

volumes:
  mongo-data:

networks:
  servio-net:
    driver: bridge
